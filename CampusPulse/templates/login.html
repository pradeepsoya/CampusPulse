{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusPulse | Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

    <div class="bg-grid"></div>
    <div class="bg-glow glow-a"></div>
    <div class="bg-glow glow-b"></div>

    <div class="bg-icons">
        <span class="bg-icon i1"><i class="bi bi-thermometer-half"></i></span>
        <span class="bg-icon i2"><i class="bi bi-wifi"></i></span>
        <span class="bg-icon i3"><i class="bi bi-lightbulb-fill"></i></span>
        <span class="bg-icon i4"><i class="bi bi-person-bounding-box"></i></span>
        <span class="bg-icon i5"><i class="bi bi-cpu-fill"></i></span>
        <span class="bg-icon i6"><i class="bi bi-droplet-half"></i></span>
    </div>

    <main class="login-wrapper">
        <div class="login-card">

            <div class="brand">
                <span class="brand-icon"><i class="bi bi-building-gear"></i></span>
                <h1>CampusPulse</h1>
                <p class="brand-subtitle">Smart Classroom Monitoring &amp; Energy Management</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert-box">
                        <i class="bi bi-exclamation-circle-fill"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'login' %}" novalidate>
                {% csrf_token %}

                <label class="field-label" for="usernameField">Username / Email</label>
                <div class="input-group">
                    <i class="bi bi-person-fill"></i>
                    <input
                        type="text"
                        name="username"
                        id="usernameField"
                        placeholder="Enter your username or email"
                        autocomplete="username"
                        required
                        autofocus>
                </div>

                <label class="field-label" for="passwordField">Password</label>
                <div class="input-group">
                    <i class="bi bi-lock-fill"></i>
                    <input
                        type="password"
                        name="password"
                        id="passwordField"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </div>


                <button type="submit" class="login-btn">
                    Sign In
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <div class="divider"></div>

           
            <div class="card-footer">
                <span class="status-dot"></span>
                <span>System Online</span>
                <span class="dot-sep">•</span>
                <span>CampusPulse © 2026</span>
            </div>

        </div>
    </main>

</body>
</html>
