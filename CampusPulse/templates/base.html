{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CampusPulse{% endblock %}</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">

    {% block extra_css %}{% endblock %}
</head>


<body>

<!-- ================= TOP NAVIGATION ================= -->

<header class="main-navbar">

    <!-- Brand -->

    <a href="{% url 'dashboard' %}" class="brand">

        <div class="brand-icon">
            <i class="bi bi-activity"></i>
        </div>

        <div class="brand-text">
            <span class="brand-name">CampusPulse</span>
            <span class="brand-subtitle">Smart Classroom</span>
        </div>

    </a>


    <!-- Navigation -->

    <nav class="main-nav">

        <a href="{% url 'dashboard' %}"
           class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">

            <i class="bi bi-grid-fill"></i>
            <span>Home</span>

        </a>


        <a href="{% url 'live_monitoring' %}"
           class="{% if request.resolver_match.url_name == 'live_monitoring' %}active{% endif %}">

            <i class="bi bi-broadcast"></i>
            <span>Live Monitoring</span>

        </a>


        <a href="{% url 'analytics' %}"
           class="{% if request.resolver_match.url_name == 'analytics' %}active{% endif %}">

            <i class="bi bi-graph-up-arrow"></i>
            <span>Analytics</span>

        </a>


        <a href="{% url 'settings' %}"
   class="{% if request.resolver_match.url_name == 'settings' %}active{% endif %}">
    <i class="bi bi-gear"></i>
    <span>Settings</span>
</a>

    </nav>


    <!-- ================= RIGHT SIDE ================= -->

    <!--<div class="navbar-actions">-->

        <!-- Search -->

        <!--<button class="nav-icon-btn" title="Search" type="button">

            <i class="bi bi-search"></i>

        </button>-->


        <!-- Notifications -->

        <!--<button class="nav-icon-btn notification-btn"
                title="Notifications"
                type="button">

            <i class="bi bi-bell"></i>

            <span class="notification-dot"></span>

        </button>-->

    
        <!-- ================= ADMIN PROFILE ================= -->

        <div class="admin-profile-wrapper">

            <!-- Profile Button -->

            <button class="admin-profile"
                    id="adminProfileBtn"
                    type="button">

                <div class="profile-avatar">

                    <i class="bi bi-person-fill"></i>

                </div>


                <div class="profile-info">

                    <span class="profile-name">
                        Administrator
                    </span>

                    <span class="profile-role">
                        Super Admin
                    </span>

                </div>


                <i class="bi bi-chevron-down profile-arrow"></i>

            </button>


            <!-- ================= PROFILE DROPDOWN ================= -->

            <div class="profile-dropdown"
                 id="profileDropdown">


                <!-- Dropdown Header -->

                <div class="profile-dropdown-header">

                    <div class="profile-dropdown-avatar">

                        <i class="bi bi-person-fill"></i>

                    </div>


                    <div>

                        <strong>
                            Administrator
                        </strong>

                        <span>
                            Super Admin
                        </span>

                    </div>

                </div>


                <!-- Divider -->

                <div class="profile-dropdown-divider"></div>


                <!-- My Profile -->

                <a href="{% url 'profile' %}" class="profile-dropdown-item">
    <i class="bi bi-person"></i>
    <span>My Profile</span>
</a>


                <!-- Account Settings -->

<a href="{% url 'account_settings' %}" class="profile-dropdown-item">
    <i class="bi bi-gear"></i>
    <span>Account Settings</span>
</a>


                <!-- Divider -->

                <div class="profile-dropdown-divider"></div>


                <!-- Logout -->

                <a href="{% url 'logout' %}"
                   class="profile-dropdown-item logout-item">

                    <i class="bi bi-box-arrow-right"></i>

                    <span>
                        Logout
                    </span>

                </a>

            </div>

        </div>

    </div>

</header>


<!-- ================= MAIN CONTENT ================= -->

<main class="main-content">

    {% block content %}
    {% endblock %}

</main>


<!-- ================= SCRIPTS ================= -->

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<!-- Page-specific JavaScript -->
{% block extra_js %}
{% endblock %}


<!-- Custom JS -->
<script src="{% static 'js/script.js' %}"></script>


</body>

</html>
