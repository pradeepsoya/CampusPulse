{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CampusPulse{% endblock %}</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

<!-- Sidebar -->

<aside class="sidebar">

    <div class="logo">
        <div class="system-status"></div>

        <div class="logo-text">
            <h3>📡 CampusPulse</h3>
            <p>Smart Classroom</p>
        </div>
    </div>

    <ul class="menu">

        <li class="active">
            <a href="#">
                <i class="bi bi-grid-fill"></i>
                Home
            </a>
        </li>

        <li>
            <a href="#">
                <i class="bi bi-broadcast"></i>
                Live Monitoring
            </a>
        </li>

        <li>
            <a href="#">
                <i class="bi bi-graph-up-arrow"></i>
                Analytics
            </a>
        </li>

        <li>
            <a href="#">
                <i class="bi bi-file-earmark-bar-graph-fill"></i>
                Reports
            </a>
        </li>

        <li>
            <a href="#">
                <i class="bi bi-gear-fill"></i>
                Settings
            </a>
        </li>

    </ul>

    <div class="sidebar-footer">

        <a href="{% url 'logout' %}" class="logout-link">
            <i class="bi bi-box-arrow-right"></i>
            Logout
        </a>

    </div>

</aside>

    <!-- Main Content -->

    <main class="main-content">

        <!-- Top Navigation -->

        <div class="topbar">

    <div class="page-title">
        <h2>Home</h2>
    </div>

    <div class="top-icons">

        <i class="bi bi-search"></i>

        <i class="bi bi-bell-fill"></i>

        <div class="profile">

            <i class="bi bi-person-circle"></i>

            <div class="profile-text">
                <span>Administrator</span>
            </div>

        </div>

    </div>

</div>

        <!-- Dynamic Content -->

        {% block content %}
        {% endblock %}

    </main>

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Custom JS -->
<script src="{% static 'js/script.js' %}"></script>

</body>
</html>
